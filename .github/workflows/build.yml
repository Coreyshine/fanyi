name: build

# 三平台自动构建 + 安装包：每次推送自动编译 Windows / Linux / macOS 安装包
# 推送 v* 标签（如 git tag v1.0.1 && git push --tags）：自动创建 GitHub Release 并附上各平台包
# Windows 额外产出一键安装包 fanyi-setup-<版本>.exe（Inno Setup，含 CPU/CUDA 运行库与浏览器扩展）
# Linux 额外产出 fanyi-linux-x64.deb 与 fanyi-linux-x64.AppImage
# macOS 额外产出 fanyi-macos-arm64.dmg
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bindir: build/Release
            archive: zip
          - os: ubuntu-22.04        # 较老 glibc，兼容更多发行版
            name: linux-x64
            bindir: build
            archive: tar.gz
          - os: macos-latest        # Apple Silicon
            name: macos-arm64
            bindir: build
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # 拉取 llama.cpp v0.5.0

      - name: Download onnxruntime (OCR)
        shell: bash
        run: |
          V=1.20.1
          mkdir -p third_party/onnxruntime
          case "${{ runner.os }}" in
            Windows)
              curl -sL -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-win-x64-$V.zip"
              python -c "import zipfile; zipfile.ZipFile('ort.zip').extractall('third_party/onnxruntime')"
              ;;
            macOS)
              curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-osx-arm64-$V.tgz" | tar xz -C third_party/onnxruntime ;;
            Linux)
              curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-linux-x64-$V.tgz" | tar xz -C third_party/onnxruntime ;;
          esac
          # 统一拍平嵌套目录（python 跨平台，不依赖 shell 通配）
          python scripts/patch_ort.py
          test -f third_party/onnxruntime/include/onnxruntime_cxx_api.h
          test -d third_party/onnxruntime/lib

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.name == 'linux-x64' && '2' || '8' }} --target fanyi-server fanyi-cli

      # ----------------------------------------------------------
      # Linux：tar.gz 便携包 + scripts/package_linux.sh（deb + AppImage）
      # ----------------------------------------------------------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p stage
          cp build/fanyi-server stage/
          cp build/fanyi-cli stage/ 2>/dev/null || true
          cp build/settings.html stage/
          cp -r extension stage/
          cp -r extension-firefox stage/ 2>/dev/null || true
          cp README.md docs/USAGE.md docs/BUILD.md stage/ 2>/dev/null || true
          # OCR 运行库随包
          cp third_party/onnxruntime/lib/libonnxruntime*.so* stage/ 2>/dev/null || true
          cd stage && tar czf ../fanyi-linux-x64.tar.gz . && cd ..
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export FANYI_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/package_linux.sh

      # ----------------------------------------------------------
      # macOS：tar.gz 便携包 + Fanyi.app + DMG
      # ----------------------------------------------------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p stage
          cp build/fanyi-server stage/
          cp build/fanyi-cli stage/ 2>/dev/null || true
          cp build/settings.html stage/
          cp -r extension stage/
          cp -r extension-firefox stage/ 2>/dev/null || true
          cp README.md docs/USAGE.md docs/BUILD.md stage/ 2>/dev/null || true
          cp third_party/onnxruntime/lib/libonnxruntime*.dylib stage/ 2>/dev/null || true
          cd stage && zip -rq ../fanyi-macos-arm64.zip . && cd ..

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # scripts/package_macos.sh 生成 dist/Fanyi.app（自动 ad-hoc 签名，无证书也可用）；
          # 脚本末尾的 ls 在 CI（无内置模型）会报错，属已知问题，用 || true 兜底后校验产物
          ./scripts/package_macos.sh || true
          test -d dist/Fanyi.app
          hdiutil create -volname "fanyi" -srcfolder dist -ov -format UDZO fanyi-macos-arm64.dmg

      # ----------------------------------------------------------
      # Windows：zip 便携包 + Inno Setup 一键安装包
      # llama.cpp 运行库（v0.5.0 = b11146）：CPU 必需，CUDA 供有 N 卡用户
      # ----------------------------------------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build/Release/fanyi-server.exe stage/
          Copy-Item build/Release/fanyi-cli.exe stage/
          Copy-Item build/Release/settings.html stage/
          Copy-Item -Recurse -Force extension stage/
          Copy-Item -Recurse -Force extension-firefox stage/ -ErrorAction SilentlyContinue
          Copy-Item README.md stage/ -ErrorAction SilentlyContinue
          Copy-Item docs/USAGE.md stage/ -ErrorAction SilentlyContinue
          Copy-Item docs/BUILD.md stage/ -ErrorAction SilentlyContinue
          Copy-Item third_party/onnxruntime/lib/onnxruntime.dll stage/ -ErrorAction SilentlyContinue

          # llama.cpp 运行库：下载官方 b11146 预编译包（CPU 17MB / CUDA 242MB / cudart 373MB）
          curl -sL --retry 3 -o cpu.zip    "https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-win-cpu-x64.zip"
          curl -sL --retry 3 -o cuda.zip   "https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-win-cuda-12.4-x64.zip"
          curl -sL --retry 3 -o cudart.zip "https://github.com/ggml-org/llama.cpp/releases/download/b11146/cudart-llama-bin-win-cuda-12.4-x64.zip"
          foreach ($z in 'cpu','cuda','cudart') {
            New-Item -ItemType Directory -Force -Path "ext-$z" | Out-Null
            python -c "import zipfile; zipfile.ZipFile('$z.zip').extractall('ext-$z')"
          }
          New-Item -ItemType Directory -Force -Path stage/llama-cpu, stage/llama-cuda | Out-Null
          Get-ChildItem ext-cpu    -Recurse -Filter *.dll | Copy-Item -Destination stage/llama-cpu -Force
          Get-ChildItem ext-cuda   -Recurse -Filter *.dll | Copy-Item -Destination stage/llama-cuda -Force
          Get-ChildItem ext-cudart -Recurse -Filter *.dll | Copy-Item -Destination stage/llama-cuda -Force

          # 便携 zip 也能直接跑：CPU 运行库放 exe 旁 + GPU 切换脚本
          Copy-Item stage/llama-cpu/*.dll stage/ -Force
          Copy-Item scripts/安装运行库.bat stage/ -ErrorAction SilentlyContinue
          Compress-Archive -Path stage/* -DestinationPath fanyi-windows-x64.zip

      - name: Build installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = ($env:GITHUB_REF_NAME -replace '^v','')
          if ($v -notmatch '^\d') { $v = '1.1.0' }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item stage/* pkg/ -Recurse -Force
          Copy-Item scripts/fanyi-installer.iss pkg/
          Copy-Item scripts/fanyi-server-background.vbs pkg/
          # 若仓库根有 Mozilla 官方签名的 xpi（AMO unlisted 签名产物），捆绑进安装包
          Copy-Item fanyi-firefox-signed.xpi pkg/ -ErrorAction SilentlyContinue
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$v" pkg/fanyi-installer.iss
          Copy-Item "pkg/dist/fanyi-setup-$v.exe" "fanyi-setup-$v.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanyi-${{ matrix.name }}
          path: |
            fanyi-windows-x64.zip
            fanyi-setup-*.exe
            fanyi-linux-x64.tar.gz
            fanyi-linux-x64.deb
            fanyi-linux-x64.AppImage
            fanyi-macos-arm64.zip
            fanyi-macos-arm64.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
