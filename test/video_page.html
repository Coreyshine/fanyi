<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Subtitle Test</title>
<script src="shim.js?v=2"></script>
<style>
  :root { color-scheme: light; }
  html, body { background: #111; color: #eee; }
  body { max-width: 720px; margin: 30px auto; padding: 0 20px; font: 14px/1.6 sans-serif; }
  .player { position: relative; background: #000; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; }
  .player video { width: 100%; height: 100%; object-fit: cover; }
  .caption { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
             font: 600 18px/1.4 sans-serif; color: #fff; text-shadow: 0 1px 3px #000; }
  .caption span { background: rgba(0,0,0,.6); padding: 2px 10px; border-radius: 4px; }
  .demo { background: #f0f5ff; color: #1c2330; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="demo">模拟视频播放器：字幕每 2.5 秒切换一句英文（下方黑框内）。扩展应实时在英文字幕下方注入中文译文。</div>
<div class="player">
  <video muted autoplay loop playsinline
         src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
  <div class="caption"><span id="cap">Hello everyone, welcome back to the channel.</span></div>
</div>
<script>
const lines = [
  'Hello everyone, welcome back to the channel.',
  'Today we are talking about local AI models.',
  'Running translation on your own machine has huge privacy benefits.',
  'No cloud servers, no tracking, no subscriptions.',
  'Let me show you how it works in practice.',
];
let i = 0;
setInterval(() => { i = (i + 1) % lines.length; document.getElementById('cap').textContent = lines[i]; }, 2500);
</script>
</body>
</html>
